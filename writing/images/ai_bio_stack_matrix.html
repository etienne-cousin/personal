<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#fafaf7"/>

  <!-- Title block -->
  <text x="60" y="55" font-size="26" font-weight="700" fill="#1a1a1a">The AI-Bio Stack</text>
  <text x="60" y="85" font-size="15" font-weight="400" fill="#555">Three layers, three theses. Each has fundamentally different economics.</text>

  <!-- Column headers -->
  <g font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">
    <rect x="60" y="115" width="220" height="50" fill="#1a1a1a"/>
    <text x="170" y="146" fill="#fafaf7" font-size="13">LAYER</text>

    <rect x="280" y="115" width="220" height="50" fill="#2a2a2a"/>
    <text x="390" y="140" fill="#fafaf7" font-size="13">DEFENSIBILITY</text>
    <text x="390" y="156" fill="#bbb" font-size="11" font-weight="400">what's the moat</text>

    <rect x="500" y="115" width="220" height="50" fill="#2a2a2a"/>
    <text x="610" y="140" fill="#fafaf7" font-size="13">CAPITAL INTENSITY</text>
    <text x="610" y="156" fill="#bbb" font-size="11" font-weight="400">cost to compete</text>

    <rect x="720" y="115" width="220" height="50" fill="#2a2a2a"/>
    <text x="830" y="140" fill="#fafaf7" font-size="13">TIME TO VALIDATION</text>
    <text x="830" y="156" fill="#bbb" font-size="11" font-weight="400">years to proof point</text>

    <rect x="940" y="115" width="200" height="50" fill="#2a2a2a"/>
    <text x="1040" y="140" fill="#fafaf7" font-size="13">EXIT PROFILE</text>
    <text x="1040" y="156" fill="#bbb" font-size="11" font-weight="400">who buys, when</text>
  </g>

  <!-- Row 1: Therapeutics -->
  <g>
    <!-- Layer label cell -->
    <rect x="60" y="165" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <rect x="60" y="165" width="6" height="170" fill="#1f4068"/>
    <text x="80" y="195" font-size="11" font-weight="600" fill="#1f4068" letter-spacing="1">LAYER 1</text>
    <text x="80" y="220" font-size="18" font-weight="700" fill="#1a1a1a">Therapeutics</text>
    <text x="80" y="244" font-size="12" font-weight="500" fill="#555">Class II biotechs</text>
    <text x="80" y="270" font-size="11" fill="#777">Companies whose</text>
    <text x="80" y="284" font-size="11" fill="#777">terminal product is</text>
    <text x="80" y="298" font-size="11" fill="#777">a drug.</text>
    <text x="80" y="322" font-size="10" font-style="italic" fill="#999">Insilico, Recursion,</text>

    <!-- Defensibility -->
    <rect x="280" y="165" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="300" y="195" font-size="13" font-weight="600" fill="#1a1a1a">Clinical data + IP</text>
    <text x="300" y="220" font-size="11" fill="#555">Same moat as traditional</text>
    <text x="300" y="234" font-size="11" fill="#555">biotech. AI changes input</text>
    <text x="300" y="248" font-size="11" fill="#555">cost, not moat structure.</text>
    <g font-size="10" fill="#1f4068" font-weight="600">
      <text x="300" y="278">— Patent estate</text>
      <text x="300" y="294">— Phase 2/3 readouts</text>
      <text x="300" y="310">— Regulatory exclusivity</text>
    </g>

    <!-- Capital intensity -->
    <rect x="500" y="165" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="520" y="195" font-size="13" font-weight="600" fill="#c0392b">Very High</text>
    <!-- intensity bars -->
    <g>
      <rect x="520" y="205" width="20" height="8" fill="#c0392b"/>
      <rect x="544" y="205" width="20" height="8" fill="#c0392b"/>
      <rect x="568" y="205" width="20" height="8" fill="#c0392b"/>
      <rect x="592" y="205" width="20" height="8" fill="#c0392b"/>
      <rect x="616" y="205" width="20" height="8" fill="#c0392b"/>
    </g>
    <text x="520" y="240" font-size="11" fill="#555">Multi-hundred-million</text>
    <text x="520" y="254" font-size="11" fill="#555">per program. Platform</text>
    <text x="520" y="268" font-size="11" fill="#555">claims don't escape</text>
    <text x="520" y="282" font-size="11" fill="#555">trial costs.</text>
    <text x="520" y="312" font-size="11" font-weight="600" fill="#1a1a1a">~$2.6B all-in / approval</text>

    <!-- Time -->
    <rect x="720" y="165" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="740" y="195" font-size="13" font-weight="600" fill="#1a1a1a">5-10+ years</text>
    <text x="740" y="218" font-size="11" fill="#555">To clinical proof.</text>
    <!-- Timeline bar -->
    <g>
      <rect x="740" y="232" width="180" height="6" fill="#e5e5e0" rx="3"/>
      <rect x="740" y="232" width="180" height="6" fill="#1f4068" rx="3"/>
      <text x="740" y="256" font-size="10" fill="#777">Year 0</text>
      <text x="900" y="256" font-size="10" fill="#777" text-anchor="end">Year 10+</text>
    </g>
    <text x="740" y="290" font-size="11" fill="#555">PCC nomination is a</text>
    <text x="740" y="304" font-size="11" fill="#555">milestone, not validation.</text>
    <text x="740" y="318" font-size="11" fill="#555">Phase 2 is the threshold.</text>

    <!-- Exit -->
    <rect x="940" y="165" width="200" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="960" y="195" font-size="13" font-weight="600" fill="#1a1a1a">IPO or pharma M&amp;A</text>
    <text x="960" y="220" font-size="11" fill="#555">Both gated by clinical</text>
    <text x="960" y="234" font-size="11" fill="#555">readouts.</text>
    <g font-size="10" fill="#1f4068" font-weight="600">
      <text x="960" y="266">— Insilico (HKEX, Dec '25)</text>
      <text x="960" y="282">— Nimbus → Takeda ($6B)</text>
      <text x="960" y="298">— Long IPO windows</text>
    </g>
    <text x="960" y="324" font-size="10" font-style="italic" fill="#c0392b">Trap: platform vs. asset</text>
  </g>

  <!-- Row 2: Agentic Workflows -->
  <g>
    <!-- Layer label cell -->
    <rect x="60" y="335" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <rect x="60" y="335" width="6" height="170" fill="#7a5fa3"/>
    <text x="80" y="365" font-size="11" font-weight="600" fill="#7a5fa3" letter-spacing="1">LAYER 2</text>
    <text x="80" y="390" font-size="18" font-weight="700" fill="#1a1a1a">Agentic Workflows</text>
    <text x="80" y="414" font-size="12" font-weight="500" fill="#555">Closed-loop platforms</text>
    <text x="80" y="440" font-size="11" fill="#777">Systems that orchestrate</text>
    <text x="80" y="454" font-size="11" fill="#777">hypothesis, experiment,</text>
    <text x="80" y="468" font-size="11" fill="#777">analysis - autonomously.</text>
    <text x="80" y="492" font-size="10" font-style="italic" fill="#999">EvolutionaryScale, Chai</text>

    <!-- Defensibility -->
    <rect x="280" y="335" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="300" y="365" font-size="13" font-weight="600" fill="#1a1a1a">Data flywheels</text>
    <text x="300" y="390" font-size="11" fill="#555">Closed-loop discovery</text>
    <text x="300" y="404" font-size="11" fill="#555">generates proprietary</text>
    <text x="300" y="418" font-size="11" fill="#555">data → better model →</text>
    <text x="300" y="432" font-size="11" fill="#555">more proprietary data.</text>
    <g font-size="10" fill="#7a5fa3" font-weight="600">
      <text x="300" y="462">— Integration depth</text>
      <text x="300" y="478">— Workflow lock-in</text>
    </g>
    <text x="300" y="498" font-size="10" font-style="italic" fill="#c0392b">If the flywheel actually flywheels</text>

    <!-- Capital intensity -->
    <rect x="500" y="335" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="520" y="365" font-size="13" font-weight="600" fill="#d68a3c">Medium</text>
    <g>
      <rect x="520" y="375" width="20" height="8" fill="#d68a3c"/>
      <rect x="544" y="375" width="20" height="8" fill="#d68a3c"/>
      <rect x="568" y="375" width="20" height="8" fill="#d68a3c"/>
      <rect x="592" y="375" width="20" height="8" fill="#e5e5e0"/>
      <rect x="616" y="375" width="20" height="8" fill="#e5e5e0"/>
    </g>
    <text x="520" y="410" font-size="11" fill="#555">Software margins on</text>
    <text x="520" y="424" font-size="11" fill="#555">model side. Hardware</text>
    <text x="520" y="438" font-size="11" fill="#555">drag from lab integration.</text>
    <text x="520" y="478" font-size="11" font-weight="600" fill="#1a1a1a">$50-200M to scale</text>

    <!-- Time -->
    <rect x="720" y="335" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="740" y="365" font-size="13" font-weight="600" fill="#1a1a1a">2-4 years</text>
    <text x="740" y="388" font-size="11" fill="#555">To revenue traction.</text>
    <g>
      <rect x="740" y="402" width="180" height="6" fill="#e5e5e0" rx="3"/>
      <rect x="740" y="402" width="72" height="6" fill="#7a5fa3" rx="3"/>
      <text x="740" y="426" font-size="10" fill="#777">Year 0</text>
      <text x="900" y="426" font-size="10" fill="#777" text-anchor="end">Year 10</text>
    </g>
    <text x="740" y="460" font-size="11" fill="#555">Longer to prove the data</text>
    <text x="740" y="474" font-size="11" fill="#555">flywheel actually compounds.</text>
    <text x="740" y="498" font-size="10" font-style="italic" fill="#c0392b">Two clocks running</text>

    <!-- Exit -->
    <rect x="940" y="335" width="200" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="960" y="365" font-size="13" font-weight="600" fill="#1a1a1a">Strategic acquisition</text>
    <text x="960" y="390" font-size="11" fill="#555">Pharma buys, or platform</text>
    <text x="960" y="404" font-size="11" fill="#555">vertically integrates into</text>
    <text x="960" y="418" font-size="11" fill="#555">therapeutics.</text>
    <g font-size="10" fill="#7a5fa3" font-weight="600">
      <text x="960" y="450">— Pharma M&amp;A common</text>
      <text x="960" y="466">— Pure-platform IPOs rare</text>
    </g>
    <text x="960" y="494" font-size="10" font-style="italic" fill="#c0392b">Trap: foundation model</text>
    <text x="960" y="506" font-size="10" font-style="italic" fill="#c0392b">wrappers with thin moat</text>
  </g>

  <!-- Row 3: Infrastructure -->
  <g>
    <!-- Layer label cell -->
    <rect x="60" y="505" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <rect x="60" y="505" width="6" height="170" fill="#2d6a4f"/>
    <text x="80" y="535" font-size="11" font-weight="600" fill="#2d6a4f" letter-spacing="1">LAYER 3</text>
    <text x="80" y="560" font-size="18" font-weight="700" fill="#1a1a1a">Infrastructure</text>
    <text x="80" y="584" font-size="12" font-weight="500" fill="#555">Biology-native picks &amp; shovels</text>
    <text x="80" y="610" font-size="11" fill="#777">Data generation, lab</text>
    <text x="80" y="624" font-size="11" fill="#777">automation, foundation</text>
    <text x="80" y="638" font-size="11" fill="#777">models as a layer.</text>
    <text x="80" y="662" font-size="10" font-style="italic" fill="#999">Strateos, Latch, Ginkgo</text>

    <!-- Defensibility -->
    <rect x="280" y="505" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
    <text x="300" y="535" font-size="13" font-weight="600" fill="#1a1a1a">Network &amp; scale economics</text>
    <text x="300" y="560" font-size="11" fill="#555">Closer to traditional</text>
    <text x="300" y="574" font-size="11" fill="#555">software/infra economics.</text>
    <text x="300" y="588" font-size="11" fill="#555">Familiar moat patterns.</text>
    <g font-size="10" fill="#2d6a4f" font-weight="600">
      <text x="300" y="620">— Switching costs</text>
      <text x="300" y="636">— Data network effects</text>
      <text x="300" y="652">— Unit economics at scale</text>
    </g>
  </g>

  <!-- Capital intensity -->
  <rect x="500" y="505" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
  <text x="520" y="535" font-size="13" font-weight="600" fill="#2d6a4f">Varies wildly</text>
  <g>
    <rect x="520" y="545" width="20" height="8" fill="#2d6a4f"/>
    <rect x="544" y="545" width="20" height="8" fill="#2d6a4f" opacity="0.5"/>
    <rect x="568" y="545" width="20" height="8" fill="#2d6a4f" opacity="0.5"/>
    <rect x="592" y="545" width="20" height="8" fill="#2d6a4f" opacity="0.5"/>
    <rect x="616" y="545" width="20" height="8" fill="#2d6a4f" opacity="0.5"/>
  </g>
  <text x="520" y="580" font-size="11" fill="#555">Pure software (Latch,</text>
  <text x="520" y="594" font-size="11" fill="#555">Quilt) is light. Lab</text>
  <text x="520" y="608" font-size="11" fill="#555">automation (Ginkgo,</text>
  <text x="520" y="622" font-size="11" fill="#555">Strateos) is brutal.</text>
  <text x="520" y="652" font-size="11" font-weight="600" fill="#1a1a1a">$10M - $1B+ depending</text>

  <!-- Time -->
  <rect x="720" y="505" width="220" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
  <text x="740" y="535" font-size="13" font-weight="600" fill="#1a1a1a">1-3 years</text>
  <text x="740" y="558" font-size="11" fill="#555">To commercial traction.</text>
  <g>
    <rect x="740" y="572" width="180" height="6" fill="#e5e5e0" rx="3"/>
    <rect x="740" y="572" width="36" height="6" fill="#2d6a4f" rx="3"/>
    <text x="740" y="596" font-size="10" fill="#777">Year 0</text>
    <text x="900" y="596" font-size="10" fill="#777" text-anchor="end">Year 10</text>
  </g>
  <text x="740" y="630" font-size="11" fill="#555">Fastest validation cycle</text>
  <text x="740" y="644" font-size="11" fill="#555">in the stack. Revenue is</text>
  <text x="740" y="658" font-size="11" fill="#555">measurable in real time.</text>

  <!-- Exit -->
  <rect x="940" y="505" width="200" height="170" fill="#fff" stroke="#e5e5e0" stroke-width="1"/>
  <text x="960" y="535" font-size="13" font-weight="600" fill="#1a1a1a">IPO or strategic</text>
  <text x="960" y="560" font-size="11" fill="#555">Cloud providers, large</text>
  <text x="960" y="574" font-size="11" fill="#555">pharma, sequencing</text>
  <text x="960" y="588" font-size="11" fill="#555">incumbents.</text>
  <g font-size="10" fill="#2d6a4f" font-weight="600">
    <text x="960" y="618">— Illumina-style outcome</text>
    <text x="960" y="634">— if unit economics land</text>
  </g>
  <text x="960" y="664" font-size="10" font-style="italic" fill="#c0392b">Trap: "compute as reagent"</text>
  <text x="960" y="676" font-size="10" font-style="italic" fill="#c0392b">unproven mechanically</text>

  <!-- Footer caption -->
  <text x="60" y="715" font-size="11" font-style="italic" fill="#777">Different layers demand different fund profiles. Funds claiming to invest "AI-bio broadly" are usually overweight one layer in practice.</text>
  <text x="60" y="735" font-size="10" fill="#999">etiennecousin.xyz</text>
</svg>
